# The west manifest file (west.yml) for MCUXpresso SDK delivery.
#
# See the west documentation for more information:
#
# https://docs.zephyrproject.org/latest/guides/west/index.html
manifest:
  remotes:
    - name: nxp
      url-base: https://github.com/NXP
    - name: nxp-zephyr
      url-base: https://github.com/nxp-zephyr
    - name: nxp-mcuxpresso
      url-base: https://github.com/nxp-mcuxpresso
  defaults:
    remote: nxp-mcuxpresso
  group-filter:
    - -optional
    - -bifrost
    - -ble_cs_algo_private
    - -bluetooth_private
  projects:
    - name: bifrost
      path: bifrost
      remote: nxp-zephyr
      revision: main
      west-commands: scripts/west_commands.yml
      groups:
        - bifrost
    - name: core
      path: mcuxsdk/
      repo-path: mcuxsdk-core
      revision: 7fdccae7e25f470d1fdfe00db83a4d3c863bf976
      west-commands: scripts/west_commands.yml
    - name: mcu-sdk-components
      repo-path: mcux-component
      path: mcuxsdk/components
      revision: e67b49539b52f6df45d76db4f565da427b007f7b
    - name: secure_storage
      repo-path: secure_storage
      path: mcuxsdk/middleware/secure_storage
      revision: 58a86d061b60fee59495172a760cb7039473d5b0
    - name: psa_crypto_driver
      url: https://github.com/NXP/psa_crypto_driver
      path: mcuxsdk/components/psa_crypto_driver
      revision: 783de0018f94721ddf12cefbe42c58d65a439490
    - name: mbedtls3x
      url: https://github.com/NXP/nxp_mbedtls
      path: mcuxsdk/middleware/mbedtls3x
      revision: 495d04b4093a8914380d7301c95dcddcc9eb86d2
    - name: fw_bin
      url: https://github.com/NXP/wifi_nb_fw
      revision: ffb1aa7ab4592ad50e0291177c1456ebe2d0bb5d
      path: mcuxsdk/components/conn_fwloader/fw_bin
    - name: mcu-sdk-examples
      repo-path: mcuxsdk-examples
      path: mcuxsdk/examples
      revision: 481c7f1cb15caab55a8c11b6ff895e23fe16d801
    - name: wifi_nxp
      url: https://github.com/NXP/wifi_nxp
      path: mcuxsdk/middleware/wifi_nxp
      revision: f79df9d70ce5ad049bbc7c7d0bf92297867f4e8d
    - name: ble_controller
      repo-path: mcuxsdk-middleware-bluetooth-controller
      path: mcuxsdk/middleware/wireless/ble_controller
      revision: 818dfe3ebb5830db7cb999afe306234f7f407154
    - name: ieee-802.15.4
      repo-path: mcux-sdk-middleware-ieee_802.15.4
      path: mcuxsdk/middleware/wireless/ieee-802.15.4
      revision: 511d1c09302f586da973deaefd43144d30aba762
    - name: lwip
      url: https://github.com/nxp-mcuxpresso/lwip
      path: mcuxsdk/middleware/lwip
      revision: ddc007e9302d00c7ad026c2384724c2e0d82637d
    - name: mcuxsdk-manifests
      repo-path: mcuxsdk-manifests
      path: manifests
      revision: v26.03.00
      import:
        name-allowlist:
          - freertos-kernel
          - core
          - mcux-sdk-middleware-connectivity-framework
          - mcux-freertos-drivers
          - mcux-devices-wireless
          - CMSIS
          - mcux-sdk-middleware-sdmmc
          - fatfs
          - ethermind
          - mbedtls
          - mbedtls3x
          - littlefs
          - bluetooth
          - edgefast_bt_ble
          - XCVR
          - mcux-sdk-middleware-multicore
          - usb
          - rpmsg-lite
          - secure-subsystem
          - wpa_supplicant-rtos
          - els_pkc
          - mcux-devices-rt
          - mcux-devices-mcx
          - mcux-mcmgr
          - erpc
          - usb
          - mcuboot_opensource
          - mcuxsdk-tool-data
    - name: matter
      remote: nxp
      repo-path: matter
      revision: 1afceddcccd98f439edf12b66d076fa4f8d55654
      path: mcuxsdk/middleware/matter
      submodules:
        - name: nlio
          path: third_party/nlio/repo
        - name: nlassert
          path: third_party/nlassert/repo
        - name: pigweed
          path: third_party/pigweed/repo
        - name: jsoncpp
          path: third_party/jsoncpp/repo
        - name: nxp_matter_support
          path: third_party/nxp/nxp_matter_support
        - name: ot-nxp
          path: third_party/openthread/ot-nxp
        - name: simw-top-mini
          path: third_party/simw-top-mini/repo
        - name: uriparser
          path: third_party/uriparser/repo
    - name: mcu-sdk-examples-matter
      repo-path: mcuxsdk-examples-matter
      path: mcuxsdk/examples/matter_examples
      revision: edd771012653948b52020073c09d5fed472af889
