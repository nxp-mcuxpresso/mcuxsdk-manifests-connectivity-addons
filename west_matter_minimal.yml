# The west manifest file (west.yml) for MCUXpresso SDK delivery.
#
# See the west documentation for more information:
#
# https://docs.zephyrproject.org/latest/guides/west/index.html
manifest:
  remotes:
    - name: nxp
      url-base: https://github.com/NXP
    - name: nxp-zephyr
      url-base: https://github.com/nxp-zephyr
    - name: nxp-mcuxpresso
      url-base: https://github.com/nxp-mcuxpresso
  defaults:
    remote: nxp-mcuxpresso
  group-filter:
    - -optional
    - -bifrost
    - -ble_cs_algo_private
    - -bluetooth_private
  projects:
    - name: bifrost
      path: bifrost
      remote: nxp-zephyr
      revision: main
      west-commands: scripts/west_commands.yml
      groups:
        - bifrost
    - name: core
      path: mcuxsdk/
      repo-path: mcuxsdk-core
      revision: 8a9a7449af41406c3af92578629355678dfb7e9e
      west-commands: scripts/west_commands.yml
    - name: mcux-sdk-middleware-connectivity-framework
      path: mcuxsdk/middleware/wireless/framework/
      repo-path: mcux-sdk-middleware-connectivity-framework
      revision: f46bce121c30167ff6c23d7778e04f90713512c1
    - name: mcu-sdk-examples
      path: mcuxsdk/examples/
      repo-path: mcuxsdk-examples
      revision: c08e72afeec1e6babd510969ec0923db8a76b38a
    - name: mcuxsdk-manifests
      repo-path: mcuxsdk-manifests
      path: manifests
      revision: v25.09.00
      import:
        name-allowlist:
          - freertos-kernel
          - mcux-freertos-drivers
          - mcux-devices-wireless
          - CMSIS
          - mcux-sdk-middleware-sdmmc
          - fatfs
          - ethermind
          - mbedtls
          - mbedtls3x
          - psa_crypto_driver
          - lwip
          - littlefs
          - ble_controller
          - bluetooth
          - edgefast_bt_ble
          - ieee-802.15.4
          - XCVR
          - mcux-sdk-middleware-multicore
          - usb
          - rpmsg-lite
          - secure-subsystem
          - wifi_nxp
          - wpa_supplicant-rtos
          - fw_bin
          - mcu-sdk-components
          - els_pkc
          - mcux-devices-rt
          - mcux-devices-mcx
          - mcux-mcmgr
          - erpc
          - usb
          - mcuboot_opensource
          - mcuxsdk-tool-data
    - name: matter
      remote: nxp
      repo-path: matter
      revision: 9e66a3cd738dd9443d0bbe014fda15e69112d369
      path: mcuxsdk/middleware/matter
      submodules:
        - name: nlio
          path: third_party/nlio/repo
        - name: nlassert
          path: third_party/nlassert/repo
        - name: pigweed
          path: third_party/pigweed/repo
        - name: jsoncpp
          path: third_party/jsoncpp/repo
        - name: nxp_matter_support
          path: third_party/nxp/nxp_matter_support
        - name: ot-nxp
          path: third_party/openthread/ot-nxp
        - name: simw-top-mini
          path: third_party/simw-top-mini/repo
    - name: mcu-sdk-examples-matter
      repo-path: mcuxsdk-examples-matter
      path: mcuxsdk/examples/matter_examples
      revision: c2391ecf059b74ae7bfc38d620e4fa4187ccd150
